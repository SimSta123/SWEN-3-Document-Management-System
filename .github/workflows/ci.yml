name: CI

on:
  push:
    branches: [main, "sprint-*", "feature/**", "fix/**"]
  pull_request:
    branches: [main, "sprint-*"]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Verify backend
        run: ./mvnw --batch-mode --no-transfer-progress verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-results
          path: |
            backend/target/surefire-reports/
            backend/target/site/jacoco/
  compose:
    runs-on: ubuntu-latest
    env:
      POSTGRES_PASSWORD: ci-only-disposable-password
      RABBITMQ_PASSWORD: ci-only-rabbitmq-password
      WEB_PORT: "8088"
      API_PORT: "8081"
      RUSTFS_ACCESS_KEY: paperless-ci
      RUSTFS_SECRET_KEY: ci-password
      ELASTIC_PASSWORD: ci-only-elasticsearch-password
      KIBANA_PASSWORD: ci-only-kibana-service-password
    steps:
      - uses: actions/checkout@v4
      - name: Start full stack
        run: docker compose up --build --detach --wait --wait-timeout 360
      - name: Check frontend and database-backed health route
        run: |
          curl --fail --retry 5 --retry-delay 2 http://localhost:8088/ -o /tmp/paperless.html
          grep -q 'id="document-form"' /tmp/paperless.html
          curl --fail http://localhost:8088/api/health | python3 -c 'import json,sys; assert json.load(sys.stdin)["status"] == "UP"'
          curl --fail --silent http://localhost:8088/api/documents | python3 -c 'import json,sys; assert json.load(sys.stdin) == []'
          curl --fail --silent -H 'Content-Type: application/json' -d '{"title":"CI document"}' http://localhost:8088/api/documents -o /tmp/created-document.json
          document_id=$(python3 -c 'import json; print(json.load(open("/tmp/created-document.json"))["id"])')
          curl --fail --silent "http://localhost:8088/api/documents/$document_id" | python3 -c 'import json,sys; doc=json.load(sys.stdin); assert doc["title"] == "CI document" and doc["projectId"] is None'
          curl --fail --silent "http://localhost:8088/document.html?id=$document_id" -o /tmp/paperless-detail.html
          grep -q 'id="document-details"' /tmp/paperless-detail.html
      - name: Check OCR worker
        run: python3 scripts/check-ocr-worker.py
      - name: Check PDF storage and OCR result
        env:
          API_URL: http://localhost:8088/api
          ELASTICSEARCH_PASSWORD: ${{ env.ELASTIC_PASSWORD }}
        run: python3 scripts/check-ocr-flow.py
      - name: Check ELK connections
        run: python3 scripts/check-elk.py
      - name: Show service logs
        if: failure()
        run: docker compose logs --no-color
      - name: Stop CI services
        if: always()
        run: docker compose down
