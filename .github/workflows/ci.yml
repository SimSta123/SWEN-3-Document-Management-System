name: CI

on:
  push:
    branches: [main, develop, "feature/**", "fix/**"]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Verify backend
        run: ./mvnw --batch-mode --no-transfer-progress verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-results
          path: |
            backend/target/surefire-reports/
            backend/target/site/jacoco/
  compose:
    runs-on: ubuntu-latest
    env:
      POSTGRES_PASSWORD: ci-only-disposable-password
      WEB_PORT: "8088"
      API_PORT: "8081"
    steps:
      - uses: actions/checkout@v4
      - name: Start full stack
        run: docker compose up --build --detach --wait --wait-timeout 240
      - name: Check frontend and database-backed health route
        run: |
          curl --fail --retry 5 --retry-delay 2 http://localhost:8088/ -o /tmp/paperless.html
          grep -q "A place for your documents" /tmp/paperless.html
          curl --fail http://localhost:8088/api/health | python3 -c 'import json,sys; assert json.load(sys.stdin)["status"] == "UP"'
      - name: Show service logs
        if: failure()
        run: docker compose logs --no-color
      - name: Stop CI services
        if: always()
        run: docker compose down
