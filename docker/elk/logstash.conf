input {
  http {
    port => 8080
    codec => json
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    user => "elastic"
    password => "${ELASTIC_PASSWORD}"
    index => "paperless-logs-%{+yyyy.MM.dd}"
    manage_template => false
    ilm_enabled => false
    data_stream => false
  }
}
