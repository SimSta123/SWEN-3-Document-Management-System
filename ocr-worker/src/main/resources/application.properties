spring.application.name=ocr-worker
spring.main.web-application-type=none
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:paperless}
spring.rabbitmq.password=${RABBITMQ_PASSWORD}
spring.rabbitmq.listener.simple.acknowledge-mode=auto
spring.rabbitmq.listener.simple.default-requeue-rejected=false
paperless.ocr.queue=${OCR_QUEUE:document.uploaded}
paperless.ocr.result-queue=${OCR_RESULT_QUEUE:document.ocr.completed}
paperless.ocr.command=${TESSERACT_COMMAND:tesseract}
paperless.ocr.language=${OCR_LANGUAGE:eng}
paperless.ocr.timeout=${OCR_PAGE_TIMEOUT:60s}
storage.endpoint=${STORAGE_ENDPOINT:http://localhost:9000}
storage.bucket=${STORAGE_BUCKET:documents}
storage.access-key=${STORAGE_ACCESS_KEY}
storage.secret-key=${STORAGE_SECRET_KEY}
elasticsearch.url=${ELASTICSEARCH_URL:http://localhost:9200}
elasticsearch.index=${ELASTICSEARCH_INDEX:documents}
elasticsearch.username=${ELASTICSEARCH_USERNAME:elastic}
elasticsearch.password=${ELASTICSEARCH_PASSWORD}
