<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Document | Paperless</title>
  <link rel="stylesheet" href="/styles.css">
  <script src="/app.js" defer></script>
</head>
<body data-page="detail">
  <header class="app-header">
    <a class="brand" href="/"><svg class="brand-icon" aria-hidden="true"><use href="/icons.svg#brand"/></svg>Paperless</a>
  </header>
  <main class="detail-page">
    <div class="detail-toolbar">
      <a id="back-to-library" class="back-link" href="/">
        <svg class="icon" aria-hidden="true"><use href="/icons.svg#back"/></svg>
        <span id="back-label">All documents</span>
      </a>
      <div class="actions">
        <button id="refresh" class="button quiet icon-button" type="button" aria-label="Refresh document" title="Refresh document">
          <svg class="icon" aria-hidden="true"><use href="/icons.svg#refresh"/></svg>
        </button>
        <button id="delete-document" class="button quiet danger" type="button" hidden>Delete document</button>
      </div>
    </div>
    <div class="document-identity">
      <span class="document-icon-tile">
        <svg class="icon pdf-icon" aria-hidden="true"><use href="/icons.svg#pdf"/></svg>
      </span>
      <h1 id="document-heading">Document</h1>
    </div>
    <p id="detail-status" class="message" role="status">Loading document.</p>
    <div id="document-details" hidden>
      <dl class="metadata">
        <div><dt>Project</dt><dd><a id="detail-project" href="/"></a></dd></div>
        <div><dt>Document ID</dt><dd id="detail-id"></dd></div>
      </dl>
      <section class="document-summary" aria-labelledby="summary-title">
        <h2 id="summary-title">AI document summary</h2>
        <p id="detail-summary"></p>
      </section>
    </div>
  </main>
</body>
</html>
