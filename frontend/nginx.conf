# Proxy reference: https://nginx.org/en/docs/http/ngx_http_proxy_module.html
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location = /api/health {
        proxy_pass http://backend:8081/actuator/health/readiness;
        proxy_set_header Host $host;
    }

    location /api/ {
        proxy_pass http://backend:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
