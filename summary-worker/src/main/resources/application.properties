spring.application.name=summary-worker
spring.main.web-application-type=none
spring.main.keep-alive=true
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:paperless}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:}
spring.rabbitmq.listener.simple.missing-queues-fatal=false

spring.ai.openai.api-key=${OPENAI_API_KEY}
spring.ai.openai.chat.model=gpt-6.2-sol
spring.ai.openai.chat.reasoning-effort=low

paperless.summary.request-queue=${GENAI_REQUEST_QUEUE:document.genai.requested}
paperless.summary.result-queue=${GENAI_RESULT_QUEUE:document.genai.completed}

paperless.summary.project-request-queue=project.summary.requested
paperless.summary.project-result-queue=project.summary.completed
